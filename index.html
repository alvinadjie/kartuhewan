<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kartu Belajar Pintar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3c72">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --primary-bg: linear-gradient(145deg, #1e3c72, #2a5298, #6b21a8);
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
  background: var(--primary-bg);
  transition: background 0.4s ease;
  overflow: hidden;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ==================== MENU VIEW ==================== */
#menuView {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
  padding: 20px 16px 32px;
  -webkit-overflow-scrolling: touch;
}

.menu-header {
  text-align: center;
  margin-bottom: 20px;
  animation: fadeInDown 0.5s ease;
}
.menu-title {
  margin: 0;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 0.5px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.menu-subtitle {
  margin: 6px 0 0;
  font-size: 14px;
  opacity: 0.9;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  width: 100%;
  max-width: 480px;
  padding-bottom: 16px;
}

@media (min-width: 600px) {
  .category-grid {
    grid-template-columns: repeat(3, 1fr);
    max-width: 680px;
  }
}

.cat-card {
  position: relative;
  background: rgba(255, 255, 255, 0.18);
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-radius: 20px;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,0.22);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
.cat-card:active {
  transform: scale(0.95);
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.cat-icon {
  font-size: 44px;
  line-height: 1;
  margin-bottom: 8px;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25));
  transition: transform 0.2s ease;
}
.cat-card:hover .cat-icon {
  transform: scale(1.12);
}
.cat-name-id {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 2px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.cat-name-en {
  font-size: 12px;
  opacity: 0.85;
  font-weight: 600;
  margin-bottom: 8px;
}
.cat-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.25);
  color: #fff;
  letter-spacing: 0.2px;
}
.cat-badge.sound {
  background: #ff5252;
  box-shadow: 0 2px 6px rgba(255,82,82,0.4);
}

/* ==================== CARD VIEW ==================== */
#cardView {
  width: 100%;
  height: 100%;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 16px;
}

#top {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.btn-back {
  background: rgba(255, 255, 255, 0.25);
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.18);
  transition: transform 0.1s ease;
}
.btn-back:active {
  transform: scale(0.94);
  background: rgba(255, 255, 255, 0.4);
}
#catLabel {
  font-size: 16px;
  font-weight: 800;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
#cnt {
  font-size: 14px;
  font-weight: 700;
  background: rgba(0,0,0,0.22);
  padding: 4px 10px;
  border-radius: 14px;
}

#dots-wrapper {
  width: 100%;
  overflow-x: auto;
  display: flex;
  justify-content: center;
  padding: 2px 0;
  scrollbar-width: none;
}
#dots-wrapper::-webkit-scrollbar {
  display: none;
}
#dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 320px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  transition: background 0.2s, transform 0.2s;
}
.dot.on {
  background: #ffd93d;
  transform: scale(1.3);
}

#stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 440px;
  margin: 6px 0;
}
#card {
  background: rgba(255, 255, 255, 0.22);
  border: 3.5px solid rgba(255, 255, 255, 0.6);
  border-radius: 28px;
  width: min(74vw, 290px);
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2), 0 16px 28px rgba(0,0,0,0.25);
  cursor: pointer;
  position: relative;
  touch-action: pan-y;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: transform 0.12s ease;
}
#card:active {
  transform: scale(0.96);
}
#emo {
  font-size: min(32vw, 135px);
  line-height: 1;
  display: inline-block;
  animation: float 2.4s ease-in-out infinite;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
#emo.wiggle {
  animation: wiggle .55s ease;
}

/* Color swatch preview for Warna category */
.color-circle {
  width: min(28vw, 115px);
  height: min(28vw, 115px);
  border-radius: 50%;
  box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 2px 6px rgba(255,255,255,0.4);
  border: 4px solid #fff;
}

#hint {
  font-size: 13px;
  font-weight: 600;
  opacity: 0.9;
  margin-top: 10px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  text-align: center;
}

#labels {
  min-height: 72px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
}
.lbl {
  font-size: 24px;
  font-weight: 800;
  padding: 5px 20px;
  border-radius: 16px;
  opacity: 0;
  transform: translateY(8px) scale(0.85);
  transition: opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 3px 8px rgba(0,0,0,0.18);
}
.lbl.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.lbl.id {
  background: rgba(255, 255, 255, 0.35);
  color: #fff;
}
.lbl.en {
  background: rgba(0, 0, 0, 0.28);
  color: #fff;
}

#btns {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 440px;
  justify-content: center;
  margin-bottom: 8px;
}
.bt {
  flex: 1;
  max-width: 190px;
  font-size: 15px;
  font-weight: 800;
  padding: 13px 8px;
  border: 0;
  border-radius: 18px;
  color: #1e3c72;
  background: #fff;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.1s;
}
.bt:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
}

#nav {
  display: flex;
  gap: 20px;
  align-items: center;
  margin-bottom: 4px;
}
#nav button {
  font-size: 22px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.28);
  color: #fff;
  width: 52px;
  height: 52px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  transition: transform 0.1s, background 0.15s;
}
#nav button:active {
  transform: scale(0.92);
  background: rgba(255, 255, 255, 0.5);
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-8px) rotate(2deg); }
}
@keyframes wiggle {
  0% { transform: scale(1) rotate(0); }
  20% { transform: scale(1.22) rotate(-10deg); }
  40% { transform: scale(1.12) rotate(8deg); }
  60% { transform: scale(1.2) rotate(-6deg); }
  80% { transform: scale(1.08) rotate(4deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<div id="app">

    </div>
    <div class="category-grid" id="categoryGrid"></div>
  </div>

  <!-- ==================== CARD VIEW ==================== -->

        <span id="catLabel"></span>

/* ==================== STATE ==================== */
let currentCatKey = 'hewan';
let idx = 0;

const cardView = $('cardView');
const categoryGrid = $('categoryGrid');
const emo = $('emo');
const lblId = $('lblId');
const lblEn = $('lblEn');
const cnt = $('cnt');
const dots = $('dots');
const catLabel = $('catLabel');
const hint = $('hint');

/* ==================== RENDER MENU ==================== */
function renderMenu() {
  categoryGrid.innerHTML = Object.entries(CATEGORIES).map(([key, cat]) => `
    <div class="cat-card" onclick="selectCategory('${key}')">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name-id">${cat.title}</div>
      <div class="cat-name-en">${cat.titleEn}</div>
      <span class="cat-badge ${cat.hasSound ? 'sound' : ''}">${cat.hasSound ? '🔊 Suara' : cat.items.length + ' Kartu'}</span>
    </div>
  `).join('');
}

function selectCategory(key) {
  clickSound();
  currentCatKey = key;
  idx = 0;
  const cat = CATEGORIES[key];

  document.body.style.background = cat.theme;
  catLabel.textContent = cat.icon + ' ' + cat.title;
  hint.textContent = cat.hint;

  menuView.style.display = 'none';
  cardView.style.display = 'flex';

  buildDots();
  show();
}

function returnToMenu() {
  clickSound();
  cardView.style.display = 'none';
  menuView.style.display = 'flex';
  document.body.style.background = 'linear-gradient(145deg, #1e3c72, #2a5298, #6b21a8)';
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

$('btnBack').onclick = returnToMenu;

/* ==================== FLASHCARD LOGIC ==================== */
function getActiveItems() {
  return CATEGORIES[currentCatKey].items;
}

function buildDots() {
  const items = getActiveItems();
  dots.innerHTML = items.map((_, i) => `<span class="dot" id="d${i}"></span>`).join('');
}

function show() {
  const items = getActiveItems();
  const item = items[idx];
  
  if (currentCatKey === 'warna' && item.hex) {
    emo.innerHTML = `<div class="color-circle" style="background:${item.hex};"></div>`;
  } else {
    emo.textContent = item.emo;
  }
  
  lblId.textContent = '🇮🇩 ' + item.id;
  lblId.className = 'lbl id';
  lblEn.textContent = '🇬🇧 ' + item.en;
  lblEn.className = 'lbl en';
  cnt.textContent = (idx + 1) + ' / ' + items.length;

  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === idx));
}

function bump() {
  emo.classList.remove('wiggle');
  void emo.offsetWidth;
  emo.classList.add('wiggle');
}

$('prev').onclick = () => {
  const items = getActiveItems();
  idx = (idx - 1 + items.length) % items.length;
  popSound();
  show();
};

$('next').onclick = () => {
  const items = getActiveItems();
  idx = (idx + 1) % items.length;
  popSound();
  show();
};

/* Keyboard Arrow Keys */
window.addEventListener('keydown', e => {
  if (cardView.style.display === 'flex') {
    if (e.key === 'ArrowLeft') $('prev').click();
    if (e.key === 'ArrowRight') $('next').click();
    if (e.key === 'Escape') returnToMenu();
  }
});

/* Tap card gesture & swipe */
let sx = null, sy = null, moved = false;
$('card').addEventListener('pointerdown', e => {
  sx = e.clientX;
  sy = e.clientY;
  moved = false;
});

$('card').addEventListener('pointermove', e => {
  if (sx === null) return;
  if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) moved = true;
});

$('card').addEventListener('pointerup', e => {
  if (sx === null) return;
  const dx = e.clientX - sx;
  sx = null;
  if (moved) {
    if (dx < -40) $('next').click();
    else if (dx > 40) $('prev').click();
  } else {
    handleCardTap();
  }
});

function handleCardTap() {
  const cat = CATEGORIES[currentCatKey];
  if (cat.hasSound) {
    playAnimalSound();
  } else {
    bump();
    popSound();
    navigator.vibrate && navigator.vibrate(25);
    // Jika belum ada label yang muncul, munculkan dan ucapkan bahasa Indonesia
    const item = getActiveItems()[idx];
    if (!lblId.classList.contains('show')) {
      lblId.classList.add('show');
      speak(item.id, 'id-ID');
    } else if (!lblEn.classList.contains('show')) {
      lblEn.classList.add('show');
      speak(item.en, 'en-US');
    } else {
      speak(item.id, 'id-ID');
    }
  }
}

/* ==================== AUDIO SYNTHESIZER ==================== */
let ac;
function ctx() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
document.addEventListener('pointerdown', () => { try { ctx(); } catch (e) {} }, { once: true });

function tone(f, d, type = 'sine', at = 0, v = .2, slideTo = null) {
  const t = ctx().currentTime + at, o = ctx().createOscillator(), g = ctx().createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g);
  g.connect(ctx().destination);
  o.start(t);
  o.stop(t + d + .02);
}

function noise(d, at = 0, v = .25, filterFreq = 800) {
  const t = ctx().currentTime + at, buf = ctx().createBuffer(1, ctx().sampleRate * d, ctx().sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx().createBufferSource();
  src.buffer = buf;
  const f = ctx().createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = filterFreq;
  const g = ctx().createGain();
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(.001, t + d);
  src.connect(f);
  f.connect(g);
  g.connect(ctx().destination);
  src.start(t);
  src.stop(t + d);
}

function vib(f, depth, rate, d, type = 'sine', v = .2, at = 0) {
  const t = ctx().currentTime + at, o = ctx().createOscillator(), lfo = ctx().createOscillator(), lg = ctx().createGain(), g = ctx().createGain();
  o.type = type;
  o.frequency.value = f;
  lfo.frequency.value = rate;
  lg.gain.value = depth;
  lfo.connect(lg);
  lg.connect(o.frequency);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g);
  g.connect(ctx().destination);
  lfo.start(t);
  o.start(t);
  lfo.stop(t + d + .02);
  o.stop(t + d + .02);
}

const SOUNDS = {
  meow: () => { tone(420, .13, 'sawtooth', 0, .16, 780); tone(780, .2, 'sawtooth', .11, .13, 320); },
  woof: () => { noise(.08, 0, .4, 250); tone(150, .1, 'square', 0, .25, 90); noise(.08, .2, .4, 250); tone(160, .1, 'square', .2, .25, 90); },
  moo: () => { vib(140, 16, 4, .9, 'sawtooth', .22); },
  cluck: () => { tone(650, .07, 'square', 0, .15, 900); tone(600, .07, 'square', .11, .15, 850); tone(700, .07, 'square', .22, .15, 950); },
  quack: () => { vib(450, 130, 18, .25, 'square', .2); },
  bleat: () => { vib(380, 55, 9, .4, 'sawtooth', .18); },
  neigh: () => { tone(250, .15, 'sawtooth', 0, .2, 650); vib(650, 50, 14, .35, 'sawtooth', .15, .15); },
  roar: () => { noise(.7, 0, .4, 180); tone(80, .7, 'sawtooth', 0, .2, 60); },
  trumpet: () => { tone(250, .15, 'square', 0, .25, 950); tone(950, .35, 'square', .15, .2, 500); },
  croak: () => { tone(140, .12, 'square', 0, .22, 90); tone(140, .12, 'square', .2, .22, 90); },
  baa: () => { vib(420, 70, 6, .45, 'sawtooth', .18); },
  oink: () => { noise(.06, 0, .3, 400); tone(180, .08, 'sawtooth', 0, .2, 110); noise(.06, .14, .3, 400); tone(170, .08, 'sawtooth', .14, .2, 100); }
};

function clickSound() {
  tone(650, .05, 'sine', 0, .14, 850);
}

function popSound() {
  tone(480, .06, 'triangle', 0, .18, 720);
}

function speak(text, lang) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function playAnimalSound() {
  const item = getActiveItems()[idx];
  bump();
  navigator.vibrate && navigator.vibrate(40);
  if (!item.snd) return;
  const audio = new Audio('sounds/' + item.snd + '.mp3');
  audio.onerror = () => (SOUNDS[item.snd] || (() => {}))();
  audio.play().catch(() => (SOUNDS[item.snd] || (() => {}))());
}

$('bId').onclick = () => {
  const item = getActiveItems()[idx];
  lblId.classList.add('show');
  clickSound();
  speak(item.id, 'id-ID');
  bump();
};

$('bEn').onclick = () => {
  const item = getActiveItems()[idx];
  lblEn.classList.add('show');
  clickSound();
  speak(item.en, 'en-US');
  bump();
};

/* Start in Menu */
renderMenu();
</script>

if ('serviceWorker' in navigator) {
